<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Cooker - Главная</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="user-icon guest"></div>
        <ul class="nav-menu">
            <li><a href="index.html">Главная</a></li>
            <li><a href="documentHistory.html">История</a></li>
            <li><a href="templateList.html">Шаблоны</a></li>
            <li><a href="login.html">Вход</a></li>
            <li><a href="register.html">Регистрация</a></li>
            <li><a href="#" id="logoutBtn" style="display: none;">Выход</a></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="page">
            <h1>Text Cooker</h1>
            
            <div class="text-editor">
                <div class="form-group">
                    <label for="textInput">Ваш текст:</label>
                    <textarea id="textInput" placeholder="Введите текст, который нужно отформатировать..."></textarea>
                    <small style="color: #666; font-size: 12px; margin-top: 5px; display: block;">
                        💡 Выделите часть текста, чтобы применить шаблон только к выделенному фрагменту
                    </small>
                </div>
            </div>

            <div class="template-editor">
                <div class="form-group">
                    <label for="templateInput">Шаблон:</label>
                    <textarea id="templateInput" placeholder="Введите шаблон, под который будет подгоняться текст..."></textarea>
                </div>
            </div>

            <div class="form-group">
                <button class="btn btn-primary" id="applyTemplateBtn">Применить шаблон</button>
            </div>

            <div class="form-group">
                <button class="btn btn-success export-btn" id="exportBtn">Экспорт</button>
            </div>

            <div id="alertContainer"></div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
